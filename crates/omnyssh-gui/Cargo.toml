[package]
name = "omnyssh-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Omny — native GUI for the OmnySSH engine"
publish = false

# Named "Omny" (not lowercased) so `cargo tauri dev` — which runs this cargo binary
# directly, not a bundle — shows "Omny" as the app name (e.g. the macOS menu bar),
# matching productName. Still distinct from the `omny` TUI binary.
[[bin]]
name = "Omny"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The `specta` feature makes `tauri::ipc::Channel` a `specta::Type`, so the terminal
# stream channel (§3.3/§3.6) exports through tauri-specta like any other DTO.
tauri = { version = "2", features = ["specta"] }
omnyssh-core = { path = "../omnyssh-core" }
serde = { workspace = true }
tokio = { workspace = true }
# tauri-specta v2 + specta v2 are release candidates (tech-gui.md §3.3): pin exact
# rc versions. rc.21 is the last combo docs.rs builds; upgrades need re-verification.
specta = { version = "=2.0.0-rc.22", features = ["derive", "function"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-store = "2.4.3"
# `generate_context!` expands to serde_json at runtime; tests also assert the wire
# form of DTOs (e.g. HostDto never carries a password).
serde_json = "1"
